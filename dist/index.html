    <style>
      /* Uygulama davranışı: sadece dikey kaydırma.
         Telefonda sola-sağa kayma, bir öğenin ekran genişliğini aşmasından olur.
         Aşağıdaki üç kural bunu kaynağında keser. */
      *, *::before, *::after { box-sizing: border-box; }

      html, body, #root {
        max-width: 100%;
        overflow-x: hidden;        /* yatay kaydırma kapalı */
        overscroll-behavior-x: none; /* kenarda sağa-sola çekme jesti kapalı */
        margin: 0;
      }

      body {
        background: #070D1B;
        -webkit-text-size-adjust: 100%;
        text-rendering: optimizeLegibility;
      }

      /* Taşmaya en sık sebep olanlar: uzun kelimeler, geniş görseller, tablolar */
      img, svg, video, canvas { max-width: 100%; height: auto; }
      table { max-width: 100%; }
      * { overflow-wrap: anywhere; word-break: normal; }
    </style>
